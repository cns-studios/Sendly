services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - BASE_URL=${BASE_URL:-http://localhost:8085}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-sendly}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sendly}
      - POSTGRES_DB=${POSTGRES_DB:-sendly}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHUNK_DIR=/chunks
      - DATA_DIR=/data
      - BEHIND_CLOUDFLARE=${BEHIND_CLOUDFLARE:-false}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-786432000}
      - AUTO_DELETE_REPORT_COUNT=${AUTO_DELETE_REPORT_COUNT:-3}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - GIN_MODE=${GIN_MODE:-release}
      - CNS_AUTH_URL=${CNS_AUTH_URL:-https://auth.cns-studios.com}
      - CNS_AUTH_CLIENT_ID=${CNS_AUTH_CLIENT_ID:-}
      - CNS_AUTH_DESKTOP_CLIENT_ID=${CNS_AUTH_DESKTOP_CLIENT_ID:-dropzone}
      - CNS_AUTH_SERVICE_KEY=${CNS_AUTH_SERVICE_KEY:-}
    volumes:
      - chunk_data:/chunks
      - file_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sendly

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sendly}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sendly}
      - POSTGRES_DB=${POSTGRES_DB:-sendly}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sendly} -d ${POSTGRES_DB:-sendly}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sendly

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sendly

volumes:
  postgres_data:
  redis_data:
  chunk_data:
  file_data:
networks:
  sendly:
    driver: bridge