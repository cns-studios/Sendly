name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sendly
          POSTGRES_PASSWORD: sendly
          POSTGRES_DB: sendly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendly -d sendly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SENDLY_LIVE_INTEGRATION: "1"
      POSTGRES_HOST: localhost
      POSTGRES_USER: sendly
      POSTGRES_PASSWORD: sendly
      POSTGRES_DB: sendly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      # -p 1: the live tests of several packages share one database.
      - run: MIGRATIONS_DIR=$PWD/db/migrations go test ./... -race -count=1 -p 1

  # One tag per run, main-<sha7>-<unix timestamp>: sortable, so Flux image
  # automation can pick the newest one.
  tag:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.t.outputs.value }}
    steps:
      - id: t
        run: echo "value=main-${GITHUB_SHA::7}-$(date +%s)" >> "$GITHUB_OUTPUT"

  image:
    needs: [test, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The full SHA is immutable; the sortable tag is what Flux follows.
          tags: |
            ghcr.io/cns-studios/sendly:${{ github.sha }}
            ghcr.io/cns-studios/sendly:${{ needs.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
